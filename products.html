<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | Vairavel Accessories</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

<!-- HEADER -->
<header class="main-header">
  <h1 class="gold-shimmer">Vairavel Accessories</h1>
</header>

<!-- NAVBAR -->
<nav class="navbar">
  <ul>
    <li><a href="index.html">HOME</a></li>
    <li><a href="products.html">PRODUCTS</a></li>
    <li>
      <li><a href="wishlist.html">WISHLIST ❤️</a></li>
      <a href="cart.html" class="cart-link">
        CART 🛒 <span id="cartCount" class="cart-count">0</span>
      </a>
    </li>
  </ul>
</nav>

<!-- PRODUCT HEADER -->
<section class="product-header">
<h2>Shop Our Elegant Jewellery Collections</h2>
</section>

<input type="text" id="searchInput" placeholder="Search products..." class="search-box">

<!-- FILTER -->
<div class="product-filter">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="earring">Earrings</button>
<button class="filter-btn" data-filter="clip">Clips</button>
<button class="filter-btn" data-filter="bracelet">Bracelet</button>
<button class="filter-btn" data-filter="scrunch">Scrunches & Bows</button>
<button class="filter-btn" data-filter="combo">Combo</button>
<button class="filter-btn" data-filter="gift">Gift Hampers</button>
</div>

<!-- PRODUCTS -->
<section class="product-grid" id="productContainer"></section>

<!-- IMAGE MODAL -->
<div id="imageModal" class="image-modal">
  <span class="close">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<!-- SCRIPTS -->
<script src="products.js"></script>
<script src="script.js"></script>

</body>
</html>
